name: Autopilot Validation

on:
  push:
    branches:
      - autopilot/html-markdown-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-markdown-autopilot-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm

      - name: Verify bundled npm
        run: test "$(npm --version)" = "10.9.7"

      - name: Install reviewed lockfile
        run: npm ci

      - name: Verify installed dependency graph
        run: npm ls --all

      - name: Audit full dependency graph for high severity advisories
        run: npm audit --audit-level=high

      - name: Audit production dependency graph for high severity advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Validate current checkpoint
        run: npm run verify:current

      - name: Upload audited Worker bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audited-worker-bundle-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Verify generated files are ignored
        run: git status --short
