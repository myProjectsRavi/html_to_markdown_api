name: US002 Bootstrap Validation

on:
  push:
    branches:
      - autopilot/html-markdown-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-markdown-us002-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node 22.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2

      - name: Verify bundled npm
        run: test "$(npm --version)" = "10.9.7"

      - name: Generate reproducible npm lock candidate
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --audit=false --fund=false

      - name: Install exact candidate graph
        run: npm ci --legacy-peer-deps --audit=false --fund=false

      - name: Verify installed dependency graph
        run: npm ls --all

      - name: Validate US002 bootstrap
        run: npm run verify:bootstrap

      - name: Upload generated lock candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: us002-package-lock-${{ github.sha }}
          path: |
            package-lock.json
            src/worker-configuration.d.ts
          if-no-files-found: error
          retention-days: 3
