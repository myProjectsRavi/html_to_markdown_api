name: US032 lockfile refresh

on:
  push:
    branches:
      - autopilot/html-markdown-v1
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: us032-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Use Node 22.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Regenerate exact lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --audit=false --fund=false
      - name: Verify regenerated lockfile installs
        run: npm ci
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(US032): refresh dependency lockfile"
          git push origin HEAD:autopilot/html-markdown-v1
