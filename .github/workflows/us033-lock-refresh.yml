name: US033 dependency lock refresh

on:
  push:
    branches:
      - autopilot/html-markdown-v1
    paths:
      - "package.json"
      - ".github/workflows/us033-lock-refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --audit=false --fund=false
      - name: Audit refreshed full graph
        run: npm audit --audit-level=high
      - name: Emit refreshed lockfile
        run: |
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_BASE64_END"
