openapi: 3.0.3
info:
  title: HTML to Markdown and Clean Text API
  version: 1.0.0
  description: >-
    Stateless deterministic HTML-to-Markdown and HTML-to-clean-text conversion.
    Requests accept HTML content only; there is no URL-fetch endpoint. RapidAPI
    customers use marketplace-provided client headers at the gateway. The private
    gateway-to-origin credential is intentionally not part of this public contract.
x-rapidapi-client-auth:
  subscription_header: X-RapidAPI-Key
  routing_header: X-RapidAPI-Host
  private_origin_credential_exposed: false
  note: >-
    Customer-facing RapidAPI authentication is separate from the Worker's private
    gateway-to-origin authentication. Clients must not attempt to provide an origin credential.
x-limits:
  raw_json_body_bytes: 800000
  decoded_html_bytes: 131072
  tokenizer_events: 20000
  retained_nodes: 10000
  open_element_depth: 64
  attributes_per_element: 64
  attribute_name_scalars: 256
  attribute_value_bytes: 8192
  url_bytes: 2048
  table_rows: 200
  table_cells_per_row: 32
  table_cells_per_table: 6400
  output_scalars: 262144
  output_bytes: 1048576
x-validation-precedence:
  - path_and_method
  - server_configuration
  - authentication
  - content_type_and_encoding
  - bounded_raw_body
  - strict_utf8
  - json_parse
  - request_shape
  - decoded_html_limits
  - parse_and_convert
x-error-catalog:
  invalid_json: { status: 400, message: "Request body must be valid UTF-8 JSON." }
  missing_html: { status: 400, message: "The html property is required." }
  invalid_request: { status: 400, message: "Request does not match the supported schema." }
  forbidden: { status: 403, message: "Request is not authorized." }
  not_found: { status: 404, message: "Resource not found." }
  method_not_allowed: { status: 405, message: "Method not allowed." }
  input_too_large: { status: 413, message: "Input exceeds the supported limit." }
  unsupported_media_type: { status: 415, message: "Request media type or encoding is not supported." }
  input_too_complex: { status: 422, message: "Input exceeds the supported complexity limit." }
  output_too_large: { status: 422, message: "Output exceeds the supported limit." }
  internal_error: { status: 500, message: "An internal error occurred." }
  service_unavailable: { status: 503, message: "Service configuration is unavailable." }
x-router-errors:
  unknown_path: { status: 404, code: not_found }
  unsupported_method: { status: 405, code: method_not_allowed, allow_header: true }
paths:
  /health:
    get:
      operationId: getHealth
      summary: Public origin liveness check
      description: >-
        Returns a fixed liveness response. The origin Worker does not require conversion
        authentication for this path.
      responses:
        '200':
          description: Service is available.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              example: { status: ok }
  /v1/html/markdown:
    post:
      operationId: convertHtmlToMarkdown
      summary: Convert HTML to deterministic Markdown
      description: >-
        Converts submitted HTML only. Relative links are preserved according to the
        documented renderer policy; the service never fetches linked resources.
      requestBody:
        required: true
        description: >-
          JSON object with exactly one html string. Raw JSON body limit is 800000 bytes;
          decoded html limit is 131072 UTF-8 bytes. Empty html is valid.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionRequest' }
            example:
              html: <article><h1>Hello</h1><p>World</p></article>
      responses:
        '200': { $ref: '#/components/responses/MarkdownSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/InputTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableInput' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/html/text:
    post:
      operationId: convertHtmlToText
      summary: Convert HTML to deterministic clean text
      description: >-
        Converts submitted HTML directly to clean text. Markdown is not generated and
        stripped as an intermediate representation, and the service never fetches URLs.
      requestBody:
        required: true
        description: >-
          JSON object with exactly one html string. Raw JSON body limit is 800000 bytes;
          decoded html limit is 131072 UTF-8 bytes. Empty html is valid.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionRequest' }
            example:
              html: <article><h1>Hello</h1><p>World</p></article>
      responses:
        '200': { $ref: '#/components/responses/TextSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/InputTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableInput' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    RapidApiSubscriptionKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: >-
        Customer-facing RapidAPI subscription credential. It authenticates to the
        marketplace gateway and is not the Worker's private origin credential.
  headers:
    CacheControl:
      description: Application responses are not cacheable.
      schema: { type: string, enum: [no-store] }
    XContentTypeOptions:
      description: Disable MIME sniffing.
      schema: { type: string, enum: [nosniff] }
    AllowPost:
      description: Supported method for conversion paths.
      schema: { type: string, enum: [POST] }
    AllowGet:
      description: Supported method for the health path.
      schema: { type: string, enum: [GET] }
  schemas:
    ConversionRequest:
      type: object
      additionalProperties: false
      required: [html]
      properties:
        html:
          type: string
          description: Decoded HTML string; UTF-8 byte limit is 131072.
    Stats:
      type: object
      additionalProperties: false
      required: [input_bytes, output_chars]
      properties:
        input_bytes:
          type: integer
          minimum: 0
          maximum: 131072
          description: UTF-8 bytes in the decoded html string before parsing.
        output_chars:
          type: integer
          minimum: 0
          maximum: 262144
          description: Unicode scalar values in the final output.
    MarkdownSuccess:
      type: object
      additionalProperties: false
      required: [markdown, stats]
      properties:
        markdown: { type: string }
        stats: { $ref: '#/components/schemas/Stats' }
    TextSuccess:
      type: object
      additionalProperties: false
      required: [text, stats]
      properties:
        text: { type: string }
        stats: { $ref: '#/components/schemas/Stats' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorInvalidJson:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [invalid_json] }
            message: { type: string, enum: ["Request body must be valid UTF-8 JSON."] }
    ErrorMissingHtml:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [missing_html] }
            message: { type: string, enum: ["The html property is required."] }
    ErrorInvalidRequest:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [invalid_request] }
            message: { type: string, enum: ["Request does not match the supported schema."] }
    ErrorForbidden:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [forbidden] }
            message: { type: string, enum: ["Request is not authorized."] }
    ErrorNotFound:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [not_found] }
            message: { type: string, enum: ["Resource not found."] }
    ErrorMethodNotAllowed:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [method_not_allowed] }
            message: { type: string, enum: ["Method not allowed."] }
    ErrorInputTooLarge:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [input_too_large] }
            message: { type: string, enum: ["Input exceeds the supported limit."] }
    ErrorUnsupportedMediaType:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [unsupported_media_type] }
            message: { type: string, enum: ["Request media type or encoding is not supported."] }
    ErrorInputTooComplex:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [input_too_complex] }
            message: { type: string, enum: ["Input exceeds the supported complexity limit."] }
    ErrorOutputTooLarge:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [output_too_large] }
            message: { type: string, enum: ["Output exceeds the supported limit."] }
    ErrorInternal:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [internal_error] }
            message: { type: string, enum: ["An internal error occurred."] }
    ErrorServiceUnavailable:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [service_unavailable] }
            message: { type: string, enum: ["Service configuration is unavailable."] }
  responses:
    MarkdownSuccess:
      description: Markdown conversion result.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarkdownSuccess' }
          example:
            markdown: "# Hello\n\nWorld"
            stats: { input_bytes: 45, output_chars: 14 }
    TextSuccess:
      description: Clean-text conversion result.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextSuccess' }
          example:
            text: "Hello\n\nWorld"
            stats: { input_bytes: 45, output_chars: 12 }
    BadRequest:
      description: Invalid UTF-8/JSON, missing html, or invalid request shape.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ErrorInvalidJson' }
              - { $ref: '#/components/schemas/ErrorMissingHtml' }
              - { $ref: '#/components/schemas/ErrorInvalidRequest' }
          examples:
            invalid_json: { value: { error: { code: invalid_json, message: "Request body must be valid UTF-8 JSON." } } }
            missing_html: { value: { error: { code: missing_html, message: "The html property is required." } } }
            invalid_request: { value: { error: { code: invalid_request, message: "Request does not match the supported schema." } } }
    Forbidden:
      description: Gateway-origin authentication failed. RapidAPI customers must not supply the private origin credential.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorForbidden' }
          example: { error: { code: forbidden, message: "Request is not authorized." } }
    InputTooLarge:
      description: Raw body or decoded HTML byte limit exceeded.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorInputTooLarge' }
          example: { error: { code: input_too_large, message: "Input exceeds the supported limit." } }
    UnsupportedMediaType:
      description: Unsupported media type, charset or content encoding.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorUnsupportedMediaType' }
          example: { error: { code: unsupported_media_type, message: "Request media type or encoding is not supported." } }
    UnprocessableInput:
      description: Input complexity or output ceiling exceeded.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ErrorInputTooComplex' }
              - { $ref: '#/components/schemas/ErrorOutputTooLarge' }
          examples:
            input_too_complex: { value: { error: { code: input_too_complex, message: "Input exceeds the supported complexity limit." } } }
            output_too_large: { value: { error: { code: output_too_large, message: "Output exceeds the supported limit." } } }
    InternalError:
      description: Unexpected application failure.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorInternal' }
          example: { error: { code: internal_error, message: "An internal error occurred." } }
    ServiceUnavailable:
      description: Required server configuration is missing.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorServiceUnavailable' }
          example: { error: { code: service_unavailable, message: "Service configuration is unavailable." } }
    NotFound:
      description: Path is not part of the V1 contract.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorNotFound' }
          example: { error: { code: not_found, message: "Resource not found." } }
    MethodNotAllowedPost:
      description: Method is unsupported on a conversion path.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        Allow: { $ref: '#/components/headers/AllowPost' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMethodNotAllowed' }
          example: { error: { code: method_not_allowed, message: "Method not allowed." } }
    MethodNotAllowedGet:
      description: Method is unsupported on the health path.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        Allow: { $ref: '#/components/headers/AllowGet' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMethodNotAllowed' }
          example: { error: { code: method_not_allowed, message: "Method not allowed." } }
