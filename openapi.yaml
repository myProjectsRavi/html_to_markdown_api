openapi: 3.1.0
info:
  title: HTML to Markdown and Clean Text API
  version: 1.0.0
  description: >-
    Stateless V1 contract for deterministic HTML-to-Markdown and HTML-to-clean-text
    conversion. The Worker accepts only an HTML string in JSON and never accepts a URL.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Public liveness check
      responses:
        '200':
          description: Service is available.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /v1/html/markdown:
    post:
      operationId: convertHtmlToMarkdown
      summary: Convert HTML to deterministic Markdown
      requestBody:
        required: true
        description: >-
          JSON body with exactly one html string. Raw JSON body limit is 800000 bytes;
          decoded html limit is 131072 UTF-8 bytes. Empty html is valid.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionRequest'
            example:
              html: <article><h1>Hello</h1><p>World</p></article>
      responses:
        '200':
          $ref: '#/components/responses/MarkdownSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/InputTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableInput'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/html/text:
    post:
      operationId: convertHtmlToText
      summary: Convert HTML to deterministic clean text
      requestBody:
        required: true
        description: >-
          JSON body with exactly one html string. Raw JSON body limit is 800000 bytes;
          decoded html limit is 131072 UTF-8 bytes. Empty html is valid.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionRequest'
            example:
              html: <article><h1>Hello</h1><p>World</p></article>
      responses:
        '200':
          $ref: '#/components/responses/TextSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/InputTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableInput'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  headers:
    CacheControl:
      description: Application responses are not cacheable.
      schema:
        type: string
        const: no-store
    XContentTypeOptions:
      description: Disable MIME sniffing.
      schema:
        type: string
        const: nosniff
  schemas:
    ConversionRequest:
      type: object
      additionalProperties: false
      required: [html]
      properties:
        html:
          type: string
          description: Decoded HTML string; UTF-8 byte limit is 131072.
    Stats:
      type: object
      additionalProperties: false
      required: [input_bytes, output_chars]
      properties:
        input_bytes:
          type: integer
          minimum: 0
          maximum: 131072
          description: UTF-8 bytes in the decoded html string before parsing.
        output_chars:
          type: integer
          minimum: 0
          maximum: 262144
          description: Unicode scalar values in the final output.
    MarkdownSuccess:
      type: object
      additionalProperties: false
      required: [markdown, stats]
      properties:
        markdown:
          type: string
        stats:
          $ref: '#/components/schemas/Stats'
    TextSuccess:
      type: object
      additionalProperties: false
      required: [text, stats]
      properties:
        text:
          type: string
        stats:
          $ref: '#/components/schemas/Stats'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    InvalidJsonError:
      $ref: '#/components/schemas/ErrorInvalidJson'
    ErrorInvalidJson:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: invalid_json }
            message: { type: string, const: "Request body must be valid UTF-8 JSON." }
    ErrorMissingHtml:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: missing_html }
            message: { type: string, const: "The html property is required." }
    ErrorInvalidRequest:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: invalid_request }
            message: { type: string, const: "Request does not match the supported schema." }
    ErrorForbidden:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: forbidden }
            message: { type: string, const: "Request is not authorized." }
    ErrorNotFound:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: not_found }
            message: { type: string, const: "Resource not found." }
    ErrorMethodNotAllowed:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: method_not_allowed }
            message: { type: string, const: "Method not allowed." }
    ErrorInputTooLarge:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: input_too_large }
            message: { type: string, const: "Input exceeds the supported limit." }
    ErrorUnsupportedMediaType:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: unsupported_media_type }
            message: { type: string, const: "Request media type or encoding is not supported." }
    ErrorInputTooComplex:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: input_too_complex }
            message: { type: string, const: "Input exceeds the supported complexity limit." }
    ErrorOutputTooLarge:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: output_too_large }
            message: { type: string, const: "Output exceeds the supported limit." }
    ErrorInternal:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: internal_error }
            message: { type: string, const: "An internal error occurred." }
    ErrorServiceUnavailable:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, const: service_unavailable }
            message: { type: string, const: "Service configuration is unavailable." }
  responses:
    MarkdownSuccess:
      description: Markdown conversion result.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarkdownSuccess' }
          example:
            markdown: "# Hello\n\nWorld"
            stats: { input_bytes: 45, output_chars: 14 }
    TextSuccess:
      description: Clean-text conversion result.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TextSuccess' }
          example:
            text: "Hello\n\nWorld"
            stats: { input_bytes: 45, output_chars: 12 }
    BadRequest:
      description: Invalid UTF-8/JSON, missing html, or invalid request shape.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ErrorInvalidJson' }
              - { $ref: '#/components/schemas/ErrorMissingHtml' }
              - { $ref: '#/components/schemas/ErrorInvalidRequest' }
    Forbidden:
      description: Gateway-origin authentication failed.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorForbidden' }
    InputTooLarge:
      description: Raw body or decoded HTML byte limit exceeded.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorInputTooLarge' }
    UnsupportedMediaType:
      description: Unsupported media type, charset or content encoding.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorUnsupportedMediaType' }
    UnprocessableInput:
      description: Input complexity or output ceiling exceeded.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ErrorInputTooComplex' }
              - { $ref: '#/components/schemas/ErrorOutputTooLarge' }
    InternalError:
      description: Unexpected application failure.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorInternal' }
    ServiceUnavailable:
      description: Required server configuration is missing.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorServiceUnavailable' }
    NotFound:
      description: Path is not part of the V1 contract.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorNotFound' }
    MethodNotAllowedPost:
      description: Method is unsupported on a conversion path.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        Allow:
          schema: { type: string, const: POST }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMethodNotAllowed' }
    MethodNotAllowedGet:
      description: Method is unsupported on the health path.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        Allow:
          schema: { type: string, const: GET }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMethodNotAllowed' }
